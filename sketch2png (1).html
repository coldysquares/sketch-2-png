<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="sketch2PNG">
  <meta name="theme-color" content="#09090b">
  <title>sketch2PNG Pro</title>

  <style>
    :root {
      --bg: #09090b;
      --card: #141417;
      --border: #27272a;
      --accent: #3b82f6;
      --accent-2: #10b981;
      --text: #f4f4f5;
      --subtext: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 20px);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior-y: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .badge {
      font-size: 0.7rem;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 6px;
      color: var(--subtext);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .mb-8 { margin-bottom: 8px; }

    .btn {
      background: #1f1f23;
      color: var(--text);
      border: 1px solid #323238;
      padding: 10px 8px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.8rem;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      touch-action: manipulation;
      transition: transform 0.08s ease, background 0.15s ease;
    }
    .btn:active { transform: scale(0.97); opacity: 0.85; }
    .btn.active { background: var(--accent); border-color: #60a5fa; color: #fff; }
    .btn-primary { background: var(--accent); border-color: #60a5fa; color: #fff; }
    .btn-success { background: var(--accent-2); border-color: #34d399; color: #052e16; }

    input[type="file"] { display: none; }

    .controls { display: flex; flex-direction: column; gap: 10px; }
    .control-group { display: flex; flex-direction: column; gap: 4px; }
    .control-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--subtext);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      height: 22px;
      margin: 0;
    }

    details summary {
      font-size: 0.78rem;
      color: var(--subtext);
      cursor: pointer;
      font-weight: 600;
      padding: 4px 0;
      list-style: none;
    }
    details summary::-webkit-details-marker { display: none; }
    details summary::before { content: "▸ "; }
    details[open] summary::before { content: "▾ "; }

    .canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed var(--border);
      border-radius: 12px;
      overflow: hidden;
      min-height: 240px;
      margin-bottom: 12px;
      position: relative;
    }
    .bg-checker-dark  { background: repeating-conic-gradient(#1c1c21 0% 25%, #111114 0% 50%) 50% / 16px 16px; }
    .bg-checker-light { background: repeating-conic-gradient(#e4e4e7 0% 25%, #ffffff 0% 50%) 50% / 16px 16px; }
    .bg-emerald       { background: #064e3b; }

    canvas {
      display: none;
      max-width: 100%;
      max-height: 48vh;
      max-height: 48dvh;
      object-fit: contain;
    }

    .placeholder {
      color: var(--subtext);
      font-size: 0.8rem;
      text-align: center;
      padding: 24px;
      line-height: 1.4;
    }
    .placeholder small { font-size: 0.72rem; opacity: 0.75; }

    .canvas-hud {
      position: absolute;
      bottom: 8px;
      right: 8px;
      display: none;
      gap: 6px;
    }

    .hud-pill {
      background: rgba(9, 9, 11, 0.85);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.7rem;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    #export-panel { display: none; margin-bottom: 0; }
  </style>
</head>
<body>

  <header>
    <div class="title-wrap">
      <h1>sketch2PNG</h1>
      <span id="hash-badge" class="badge">sha256: —</span>
    </div>
    <span id="meta" class="badge">Ready</span>
  </header>

  <!-- Preview first for mobile thumb ergonomics -->
  <div id="canvas-container" class="canvas-wrap bg-checker-dark">
    <div id="placeholder" class="placeholder">
      Tap <b>Load</b> or <b>Snap</b> below.<br>
      <small>Exports include SHA-256 short-hashes for clean catalog indexing.</small>
    </div>
    <canvas id="canvas"></canvas>
    <div id="hud" class="canvas-hud">
      <button id="bg-btn" class="hud-pill" type="button">BG: Dark</button>
      <button id="hold-orig" class="hud-pill" type="button">👁 Hold: Original</button>
    </div>
  </div>

  <!-- Source and ink mode -->
  <div class="panel">
    <div class="grid-4 mb-8">
      <label class="btn">
        📁 Load
        <input type="file" id="upload" accept="image/*">
      </label>
      <label class="btn">
        📷 Snap
        <input type="file" id="camera" accept="image/*" capture="environment">
      </label>
      <button id="rotate-btn" class="btn" type="button">↻ 90°</button>
      <button id="trim-btn" class="btn" type="button">✂️ Trim: Off</button>
    </div>

    <div class="grid-3">
      <button class="btn ink-mode active" data-mode="black" type="button">⚫ Black Ink</button>
      <button class="btn ink-mode" data-mode="white" type="button">⚪ White Ink</button>
      <button class="btn ink-mode" data-mode="color" type="button">🎨 Keep Color</button>
    </div>
  </div>

  <!-- Sliders and crop -->
  <div class="panel controls">
    <div class="control-group">
      <div class="control-header">
        <span>Paper Cutoff (Threshold)</span>
        <span id="thresh-val">180</span>
      </div>
      <input type="range" id="threshold" min="20" max="250" value="180">
    </div>

    <div class="control-group">
      <div class="control-header">
        <span>Edge Smoothing (Anti-Alias Feather)</span>
        <span id="smooth-val">18</span>
      </div>
      <input type="range" id="smoothing" min="0" max="75" value="18">
    </div>

    <details>
      <summary>Desk Margin Crop (% Inset)</summary>
      <div class="grid-2" style="margin-top: 8px;">
        <div class="control-group">
          <div class="control-header"><span>Top / Bottom</span><span id="crop-v-val">0%</span></div>
          <input type="range" id="crop-v" min="0" max="40" value="0">
        </div>
        <div class="control-group">
          <div class="control-header"><span>Left / Right</span><span id="crop-h-val">0%</span></div>
          <input type="range" id="crop-h" min="0" max="40" value="0">
        </div>
      </div>
    </details>
  </div>

  <!-- Export -->
  <div id="export-panel" class="panel">
    <div class="grid-3 mb-8">
      <button class="btn fmt-btn active" data-fmt="png" type="button">PNG (Lossless)</button>
      <button class="btn fmt-btn" data-fmt="webp" type="button">WebP (Small)</button>
      <button class="btn fmt-btn" data-fmt="svg" type="button">SVG (Vector)</button>
    </div>
    <div class="grid-2">
      <button id="copy-btn" class="btn" type="button">📋 Copy Image</button>
      <button id="share-btn" class="btn btn-primary" type="button">⬆️ Share / Save</button>
    </div>
  </div>

  <script>
  (() => {
    'use strict';

    // ---------- Helpers ----------
    const $ = (id) => document.getElementById(id);

    const store = {
      get(key) { try { return localStorage.getItem(key); } catch (_) { return null; } },
      set(key, value) { try { localStorage.setItem(key, value); } catch (_) { /* storage unavailable */ } }
    };

    const clamp255 = (v) => Math.max(0, Math.min(255, Math.round(v)));

    // ---------- Elements ----------
    const upload = $('upload');
    const camera = $('camera');
    const canvas = $('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const thresholdSlider = $('threshold');
    const smoothingSlider = $('smoothing');
    const cropVSlider = $('crop-v');
    const cropHSlider = $('crop-h');

    const threshVal = $('thresh-val');
    const smoothVal = $('smooth-val');
    const cropVVal = $('crop-v-val');
    const cropHVal = $('crop-h-val');

    const rotateBtn = $('rotate-btn');
    const trimBtn = $('trim-btn');
    const bgBtn = $('bg-btn');
    const holdOrigBtn = $('hold-orig');
    const copyBtn = $('copy-btn');
    const shareBtn = $('share-btn');

    const canvasContainer = $('canvas-container');
    const placeholder = $('placeholder');
    const hud = $('hud');
    const exportPanel = $('export-panel');
    const meta = $('meta');
    const hashBadge = $('hash-badge');

    // ---------- State ----------
    const INK_MODES = ['black', 'white', 'color'];
    const bgClasses = ['bg-checker-dark', 'bg-checker-light', 'bg-emerald'];
    const bgNames = ['BG: Dark', 'BG: Light', 'BG: Green'];

    let sourceImage = null;
    let rotation = 0; // 0, 90, 180, 270
    let autoTrim = false;
    let inkMode = INK_MODES.includes(store.get('s2p_inkMode')) ? store.get('s2p_inkMode') : 'black';
    let exportFormat = 'png';
    let bgIndex = 0;
    let showingOriginal = false;

    // Restore saved slider values
    if (store.get('s2p_thresh')) thresholdSlider.value = store.get('s2p_thresh');
    if (store.get('s2p_smooth')) smoothingSlider.value = store.get('s2p_smooth');

    // ---------- Apple touch icon (iOS ignores SVG icons, so render a PNG) ----------
    (function setupIcon() {
      const c = document.createElement('canvas');
      c.width = c.height = 180;
      const g = c.getContext('2d');
      g.fillStyle = '#09090b';
      g.fillRect(0, 0, 180, 180);
      g.strokeStyle = '#3b82f6';
      g.lineWidth = 14;
      g.lineCap = 'round';
      g.lineJoin = 'round';
      g.beginPath();
      g.moveTo(45, 135);
      g.lineTo(135, 45);
      g.moveTo(99, 45);
      g.lineTo(135, 45);
      g.lineTo(135, 81);
      g.stroke();
      g.fillStyle = '#10b981';
      g.beginPath();
      g.arc(63, 63, 18, 0, Math.PI * 2);
      g.fill();
      const link = document.createElement('link');
      link.rel = 'apple-touch-icon';
      link.href = c.toDataURL('image/png');
      document.head.appendChild(link);
    })();

    // ---------- Status badge ----------
    let statusTimer = null;
    function dimsText() {
      return sourceImage ? `${canvas.width}×${canvas.height}` : 'Ready';
    }
    function setStatus(message) {
      meta.textContent = message;
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => { meta.textContent = dimsText(); }, 2500);
    }

    // ---------- UI sync ----------
    function syncUI() {
      threshVal.textContent = thresholdSlider.value;
      smoothVal.textContent = smoothingSlider.value;
      cropVVal.textContent = `${cropVSlider.value}%`;
      cropHVal.textContent = `${cropHSlider.value}%`;
      trimBtn.textContent = `✂️ Trim: ${autoTrim ? 'On' : 'Off'}`;
      trimBtn.classList.toggle('active', autoTrim);

      document.querySelectorAll('.ink-mode').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.mode === inkMode);
      });
      document.querySelectorAll('.fmt-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.fmt === exportFormat);
      });
    }

    // ---------- File loading ----------
    function handleFile(e) {
      const file = e.target.files[0];
      e.target.value = ''; // allow re-selecting the same file
      if (!file) return;

      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        sourceImage = img;
        rotation = 0;
        canvas.style.display = 'block';
        placeholder.style.display = 'none';
        hud.style.display = 'flex';
        exportPanel.style.display = 'block';
        processImage();
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        setStatus('Unreadable image');
      };
      img.src = url;
    }

    // ---------- Core processing ----------
    function processImage() {
      if (!sourceImage) return;

      const W = sourceImage.naturalWidth;
      const H = sourceImage.naturalHeight;
      const rot90 = rotation % 180 !== 0;

      // Crop sliders are in on-screen terms, so after a 90/270 rotation
      // the vertical slider maps to the source's horizontal axis.
      const vPct = parseInt(cropVSlider.value, 10) / 100;
      const hPct = parseInt(cropHSlider.value, 10) / 100;
      const xInset = (rot90 ? vPct : hPct) * W;
      const yInset = (rot90 ? hPct : vPct) * H;

      const sx = Math.round(xInset);
      const sy = Math.round(yInset);
      const sw = Math.max(1, Math.round(W - xInset * 2));
      const sh = Math.max(1, Math.round(H - yInset * 2));

      // Offscreen canvas with rotation applied
      const off = document.createElement('canvas');
      const octx = off.getContext('2d', { willReadFrequently: true });
      off.width = rot90 ? sh : sw;
      off.height = rot90 ? sw : sh;

      octx.save();
      octx.translate(off.width / 2, off.height / 2);
      octx.rotate((rotation * Math.PI) / 180);
      octx.drawImage(sourceImage, sx, sy, sw, sh, -sw / 2, -sh / 2, sw, sh);
      octx.restore();

      if (showingOriginal) {
        canvas.width = off.width;
        canvas.height = off.height;
        ctx.drawImage(off, 0, 0);
        return;
      }

      // Luminance to alpha
      const imgData = octx.getImageData(0, 0, off.width, off.height);
      const data = imgData.data;
      const thresh = parseInt(thresholdSlider.value, 10);
      const smooth = parseInt(smoothingSlider.value, 10);

      let minX = off.width, minY = off.height, maxX = -1, maxY = -1;
      let hasOpaque = false;

      for (let y = 0; y < off.height; y++) {
        for (let x = 0; x < off.width; x++) {
          const i = (y * off.width + x) * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const luma = 0.299 * r + 0.587 * g + 0.114 * b;

          let alpha = 0;
          if (luma < thresh - smooth) {
            alpha = 255;
          } else if (smooth > 0 && luma < thresh + smooth) {
            alpha = Math.round(255 * (1 - (luma - (thresh - smooth)) / (smooth * 2)));
          }

          if (alpha > 0) {
            if (inkMode === 'black') {
              data[i] = 0; data[i + 1] = 0; data[i + 2] = 0;
            } else if (inkMode === 'white') {
              data[i] = 255; data[i + 1] = 255; data[i + 2] = 255;
            } else {
              // Boost saturation so colored ink holds up once paper is removed
              data[i]     = clamp255((r - luma) * 1.35 + luma * 0.75);
              data[i + 1] = clamp255((g - luma) * 1.35 + luma * 0.75);
              data[i + 2] = clamp255((b - luma) * 1.35 + luma * 0.75);
            }

            if (alpha > 25) {
              hasOpaque = true;
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
          data[i + 3] = alpha;
        }
      }
      octx.putImageData(imgData, 0, 0);

      // Optional auto-trim of empty margins
      if (autoTrim && hasOpaque) {
        const pad = 12;
        const x0 = Math.max(0, minX - pad);
        const y0 = Math.max(0, minY - pad);
        const x1 = Math.min(off.width, maxX + 1 + pad);
        const y1 = Math.min(off.height, maxY + 1 + pad);
        const tw = x1 - x0;
        const th = y1 - y0;
        canvas.width = tw;
        canvas.height = th;
        ctx.drawImage(off, x0, y0, tw, th, 0, 0, tw, th);
      } else {
        canvas.width = off.width;
        canvas.height = off.height;
        ctx.drawImage(off, 0, 0);
      }

      meta.textContent = dimsText();
      updateShortHash();
    }

    // Coalesce rapid slider events into one render per frame
    let framePending = false;
    function scheduleProcess() {
      if (framePending) return;
      framePending = true;
      requestAnimationFrame(() => {
        framePending = false;
        processImage();
      });
    }

    // ---------- Hashing ----------
    async function computeSHA256(buffer) {
      const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(hashBuffer))
        .map((b) => b.toString(16).padStart(2, '0'))
        .join('');
    }

    let hashTimeout = null;
    function updateShortHash() {
      clearTimeout(hashTimeout);
      hashTimeout = setTimeout(() => {
        canvas.toBlob(async (blob) => {
          if (!blob) return;
          const fullHash = await computeSHA256(await blob.arrayBuffer());
          hashBadge.textContent = `sha256: ${fullHash.slice(0, 8)}`;
          hashBadge.dataset.fullHash = fullHash;
        }, 'image/png');
      }, 220);
    }

    // ---------- SVG export (run-length encoded pixel rows) ----------
    function generateVectorSVG() {
      const scale = Math.min(1, 900 / Math.max(canvas.width, canvas.height));
      const w = Math.max(1, Math.round(canvas.width * scale));
      const h = Math.max(1, Math.round(canvas.height * scale));

      const temp = document.createElement('canvas');
      temp.width = w;
      temp.height = h;
      const tctx = temp.getContext('2d', { willReadFrequently: true });
      tctx.imageSmoothingQuality = 'high';
      tctx.drawImage(canvas, 0, 0, w, h);
      const data = tctx.getImageData(0, 0, w, h).data;

      const colorMode = inkMode === 'color';
      const groups = new Map(); // fill key -> path fragments
      const addRun = (key, d) => {
        let list = groups.get(key);
        if (!list) { list = []; groups.set(key, list); }
        list.push(d);
      };
      const hex = (v) => ((v >> 4) * 17).toString(16).padStart(2, '0');

      for (let y = 0; y < h; y++) {
        let runStart = -1;
        let runKey = null;

        for (let x = 0; x <= w; x++) {
          let key = null;
          if (x < w) {
            const i = (y * w + x) * 4;
            if (data[i + 3] > 110) {
              key = colorMode ? `#${hex(data[i])}${hex(data[i + 1])}${hex(data[i + 2])}` : 'ink';
            }
          }

          if (runStart !== -1 && key !== runKey) {
            const len = x - runStart;
            addRun(runKey, `M${runStart} ${y}h${len}v1h-${len}z`);
            runStart = -1;
          }
          if (key !== null && runStart === -1) {
            runStart = x;
            runKey = key;
          }
        }
      }

      const inkFill = inkMode === 'white' ? '#ffffff' : '#000000';
      const paths = Array.from(groups, ([key, parts]) =>
        `<path fill="${key === 'ink' ? inkFill : key}" d="${parts.join('')}"/>`
      ).join('');

      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" ` +
        `width="${canvas.width}" height="${canvas.height}" shape-rendering="crispEdges">${paths}</svg>`;

      return new Blob([svg], { type: 'image/svg+xml' });
    }

    // ---------- Export ----------
    async function getExportFile() {
      let blob;
      let ext = exportFormat;

      if (exportFormat === 'svg') {
        blob = generateVectorSVG();
      } else {
        const mime = exportFormat === 'webp' ? 'image/webp' : 'image/png';
        blob = await new Promise((resolve) => canvas.toBlob(resolve, mime, 0.92));
        if (!blob) throw new Error('Encode failed');
        if (blob.type === 'image/png' && ext !== 'png') {
          ext = 'png'; // browser fell back to PNG
          setStatus('WebP unsupported, saved PNG');
        }
      }

      const hash = (await computeSHA256(await blob.arrayBuffer())).slice(0, 12);
      const filename = `sketch_${hash}.${ext}`;
      return { file: new File([blob], filename, { type: blob.type }), blob, filename };
    }

    // ---------- Events ----------
    [thresholdSlider, smoothingSlider, cropVSlider, cropHSlider].forEach((slider) => {
      slider.addEventListener('input', () => {
        store.set('s2p_thresh', thresholdSlider.value);
        store.set('s2p_smooth', smoothingSlider.value);
        syncUI();
        scheduleProcess();
      });
    });

    document.querySelectorAll('.ink-mode').forEach((btn) => {
      btn.addEventListener('click', () => {
        inkMode = btn.dataset.mode;
        store.set('s2p_inkMode', inkMode);
        syncUI();
        processImage();
      });
    });

    document.querySelectorAll('.fmt-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        exportFormat = btn.dataset.fmt;
        syncUI();
      });
    });

    rotateBtn.addEventListener('click', () => {
      rotation = (rotation + 90) % 360;
      processImage();
    });

    trimBtn.addEventListener('click', () => {
      autoTrim = !autoTrim;
      syncUI();
      processImage();
    });

    bgBtn.addEventListener('click', () => {
      canvasContainer.classList.remove(bgClasses[bgIndex]);
      bgIndex = (bgIndex + 1) % bgClasses.length;
      canvasContainer.classList.add(bgClasses[bgIndex]);
      bgBtn.textContent = bgNames[bgIndex];
    });

    // Hold to preview the original (pointer events cover touch and mouse once)
    function releaseOriginal() {
      if (!showingOriginal) return;
      showingOriginal = false;
      processImage();
    }
    holdOrigBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try { holdOrigBtn.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
      showingOriginal = true;
      processImage();
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((evt) => {
      holdOrigBtn.addEventListener(evt, releaseOriginal);
    });
    holdOrigBtn.addEventListener('contextmenu', (e) => e.preventDefault());

    // Clipboard copy. Safari needs the blob passed as a promise so the
    // user gesture survives the async encode.
    copyBtn.addEventListener('click', async () => {
      const label = '📋 Copy Image';
      try {
        const blobPromise = new Promise((resolve, reject) => {
          canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('Encode failed'))), 'image/png');
        });
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blobPromise })]);
        copyBtn.textContent = '✅ Copied!';
        copyBtn.classList.add('btn-success');
        setTimeout(() => {
          copyBtn.textContent = label;
          copyBtn.classList.remove('btn-success');
        }, 1600);
      } catch (err) {
        setStatus(`Copy failed: ${err.name || 'error'}`);
      }
    });

    // Share / save
    shareBtn.addEventListener('click', async () => {
      let exported;
      try {
        exported = await getExportFile();
      } catch (err) {
        setStatus('Export failed');
        return;
      }
      const { file, blob, filename } = exported;

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: filename });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return; // user dismissed the sheet
        }
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    });

    upload.addEventListener('change', handleFile);
    camera.addEventListener('change', handleFile);

    syncUI();
  })();
  </script>
</body>
</html>
